# Scaffold workflow. Steps are intentionally minimal until the
# corresponding services exist. Extend per implementation phase.

name: Security

on:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail on committed .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "A .env file is tracked in Git. Remove it and rotate any secret."
            exit 1
          fi

  # TODO(phase): add dependency scanning, SAST and container image scanning
  # once dependencies and Dockerfiles are functional.
